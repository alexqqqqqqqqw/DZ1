services:
  db:
    build: ./docker/postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: norma
    ports:
      - "5432:5432"
    volumes:
      - norma_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d norma"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  norma_pg:
